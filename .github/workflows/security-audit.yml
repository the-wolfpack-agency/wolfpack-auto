name: Security Audit

# Thin caller of the AgenticQA-core reusable workflow. The audit logic
# (CI/CD posture + app-security + history-exposure + pragma self-tests)
# lives in `the-wolfpack-agency/AgenticQA-core/.github/workflows/full-audit-suite.yml`
# and is installed via `pip install agenticqa-core` inside that workflow.
#
# Local scripts (audit_app_security.py / audit_cicd_security.py /
# audit_history_exposure.py / test_audit_app_security.py) have been removed
# in favor of the installed-package CLI entrypoints (agenticqa-audit-app,
# agenticqa-audit-cicd, agenticqa-audit-history, agenticqa-test-app-security-pragmas).
#
# Note: post-audit GitHub-native gates (Dependabot alert gate + CodeQL gate)
# stay here because they require repo-scoped GH_TOKEN access and aren't
# part of the AgenticQA scanner suite.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  issues: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/full-audit-suite.yml@main
    with:
      severity: 'high'
      fail_on_findings: 'true'
    secrets: inherit

  github-native-gates:
    needs: [audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot alert gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HIGH_CRIT=$(gh api "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
            --jq '[.[] | select(.security_advisory.severity == "high" or .security_advisory.severity == "critical")] | length')
          echo "::notice::dependabot_high_or_critical=$HIGH_CRIT"
          if [ "$HIGH_CRIT" -gt "0" ]; then
            echo "::error::$HIGH_CRIT open Dependabot alerts at high/critical severity"
            exit 1
          fi
          MED=$(gh api "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&per_page=100" \
            --jq '[.[] | select(.security_advisory.severity == "medium")] | length')
          echo "::notice::dependabot_medium=$MED"
          MED_CEILING=10
          if [ "$MED" -gt "$MED_CEILING" ]; then
            echo "::error::$MED open Dependabot medium alerts (ceiling=$MED_CEILING)"
            exit 1
          fi

      - name: Code-scanning (CodeQL) alert gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERR=$(gh api "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
            --jq '[.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical")] | length')
          echo "::notice::codeql_high_or_critical=$ERR"
          if [ "$ERR" -gt "0" ]; then
            echo "::error::$ERR open CodeQL high/critical findings"
            exit 1
          fi
