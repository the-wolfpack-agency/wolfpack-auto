name: Security Audit

# Thin caller of the AgenticQA-core reusable workflow. The audit logic
# (CI/CD posture + app-security + history-exposure + pragma self-tests)
# lives in `the-wolfpack-agency/AgenticQA-core/.github/workflows/full-audit-suite.yml`
# and is installed via `pip install agenticqa-core` inside that workflow.
#
# Local scripts (audit_app_security.py / audit_cicd_security.py /
# audit_history_exposure.py / test_audit_app_security.py) have been removed
# in favor of the installed-package CLI entrypoints (agenticqa-audit-app,
# agenticqa-audit-cicd, agenticqa-audit-history, agenticqa-test-app-security-pragmas).
#
# Note: post-audit GitHub-native gates (Dependabot alert gate + CodeQL gate)
# stay here because they require repo-scoped GH_TOKEN access and aren't
# part of the AgenticQA scanner suite.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  issues: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/full-audit-suite.yml@main
    with:
      severity: 'high'
      fail_on_findings: 'true'
      # Legacy client-name exposures in commit b4a448fd0cbd predate the
      # name-redaction policy. Cannot be rewritten without rewriting
      # shared history. Suppress this specific commit.
      history_allow_commits: 'b4a448fd0cbd'
      # The reusable workflow also handles the Dependabot gate.
      run_github_native_gates: 'true'
    secrets: inherit

  codeql-alert-gate:
    needs: [audit]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Code-scanning (CodeQL) alert gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NOTE: gh api writes its error JSON to stdout AND exits non-zero
          # on 403. The naive `$(gh api ... || echo "skip")` form
          # concatenates the JSON with "skip" and breaks the integer
          # compare below — capture the exit status separately.
          if ERR=$(gh api "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" \
              --jq '[.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical")] | length' 2>/dev/null); then
            :
          else
            ERR="skip"
          fi
          if [ "$ERR" = "skip" ]; then
            echo "::warning::Code-scanning API not accessible — skipping gate"
            exit 0
          fi
          echo "::notice::codeql_high_or_critical=$ERR"
          if [ "$ERR" -gt "0" ]; then
            echo "::error::$ERR open CodeQL high/critical findings"
            exit 1
          fi
