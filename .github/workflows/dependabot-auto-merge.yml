name: Dependabot auto-merge

# Auto-merges green patch/minor Dependabot PRs.
# Major version bumps ALWAYS require manual review (filtered out below).
#
# Why pull_request_target: lets us merge from forks Dependabot pushes from
# the bot account, with secrets available. We never check out PR code here
# (only inspect metadata + call gh CLI), so this is safe.
#
# audit-safe: G1 reason="dependabot-auto-merge does not actions/checkout the PR head; only metadata + gh-cli merge"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Least-privilege at the top level; the merge job is scoped below.
permissions:
  contents: read

jobs:
  dependabot-auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # enable auto-merge of the PR
      pull-requests: write   # approve + mark auto-merge
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch + minor updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
