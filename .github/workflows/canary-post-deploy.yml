# ---------------------------------------------------------------------------
# Production Canary — Post-Deploy Verification
#
# Runs after every Vercel deployment to verify the live deployment is
# operating against real infrastructure, NOT silently falling back to
# Shadow Mode.
#
# Triggers:
#   1. deployment_status — fires when Vercel deploy completes
#   2. workflow_dispatch — manual trigger for testing
#   3. schedule — nightly verification (catches drift)
#
# On failure: creates a GitHub issue and optionally triggers auto-rollback.
# ---------------------------------------------------------------------------

name: "Canary: Post-Deploy Verification"

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Target URL (overrides auto-detection)"
        required: false
        type: string
      quick:
        description: "Quick mode — deep health only, skip Playwright"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * *" # Daily at 6 AM UTC

concurrency:
  group: canary-${{ github.ref }}
  cancel-in-progress: true

env:
  CANARY_SECRET: ${{ secrets.CANARY_SECRET }}

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: Production Canary
    runs-on: ubuntu-latest
    # Only run on successful deployments (or manual/scheduled triggers)
    if: >
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Playwright
        working-directory: .
        run: npx playwright install --with-deps chromium

      - name: Determine target URL
        id: target
        run: |
          PROD_URL="https://wolfpack-auto.vercel.app"
          if [ -n "${{ inputs.url }}" ]; then
            echo "url=${{ inputs.url }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "deployment_status" ]; then
            # Use deployment URL if it's production, otherwise fall back to prod URL
            DEPLOY_URL="${{ github.event.deployment_status.target_url }}"
            if echo "$DEPLOY_URL" | grep -q "wolfpack-auto\.vercel\.app$"; then
              echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Preview URL detected ($DEPLOY_URL), using production URL instead"
              echo "url=$PROD_URL" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "url=$PROD_URL" >> "$GITHUB_OUTPUT"
          fi

      - name: Quick canary probe
        if: inputs.quick
        working-directory: .
        run: |
          bash scripts/canary-post-deploy.sh --quick --json
        env:
          CANARY_URL: ${{ steps.target.outputs.url }}

      - name: Full canary suite
        if: "!inputs.quick"
        working-directory: .
        run: |
          bash scripts/canary-post-deploy.sh --rollback
        env:
          CANARY_URL: ${{ steps.target.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Upload canary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report-${{ github.run_id }}
          path: |
            canary-report/
            canary-report.json
            .agenticqa/canary_history.jsonl
          retention-days: 30

      - name: Comment on deployment (failure)
        if: failure() && github.event_name == 'deployment_status'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.target.outputs.url }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Canary FAILED — ${url}`,
              body: [
                `## Production Canary Failure`,
                ``,
                `**URL:** ${url}`,
                `**Commit:** \`${context.sha.slice(0, 8)}\``,
                `**Run:** [${context.runId}](${runUrl})`,
                ``,
                `The post-deploy canary detected that the production deployment may be:`,
                `- Running in **Shadow Mode** (no real database connected)`,
                `- Experiencing **infrastructure issues** (DB down, ES unreachable)`,
                `- Returning **incorrect data** (shadow fallback data instead of real data)`,
                ``,
                `### Next Steps`,
                `1. Check the [canary report](${runUrl}) for specific probe failures`,
                `2. Verify \`DATABASE_URL\` is set correctly in Vercel env vars`,
                `3. Check Neon dashboard for database status`,
                `4. Consider rolling back: \`vercel rollback\``,
                ``,
                `---`,
                `*Auto-generated by Production Canary workflow*`,
              ].join('\n'),
              labels: ['canary-failure', 'production'],
            });
