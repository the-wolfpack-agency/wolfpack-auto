name: Verify

# Local `npm run verify` gate, hoisted into CI.
#
# Required secrets:
#   PROD_URL              — https://wolfpack-auto.vercel.app (or equivalent)
#   SMOKE_TEST_EMAIL      — admin sign-in email
#   SMOKE_TEST_PASSWORD   — admin sign-in password
#
# If any secret is missing, the e2e-smoke stage auto-skips instead of failing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run verify
        env:
          CI: "true"
          PROD_URL: ${{ secrets.PROD_URL }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: npm run verify

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-report-auto
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
