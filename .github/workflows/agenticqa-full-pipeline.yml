name: AgenticQA Full Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  agenticqa-scan:
    runs-on: ubuntu-latest
    name: AgenticQA Security Scan
    steps:
      - uses: actions/checkout@v4

      - name: Run AgenticQA
        uses: nhomyk/AgenticQA@main
        with:
          path: '.'
          fail-on-critical: 'true'
          sarif: 'true'
          pr-comment: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test-suite:
    runs-on: ubuntu-latest
    name: Quality & Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
      - name: Build
        run: DATABASE_URL= npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test --project=chromium --reporter=github
        env:
          CI: true
          DATABASE_URL: ''

  shadow-verification:
    runs-on: ubuntu-latest
    name: Shadow Mode Verification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
      - name: Build (shadow mode)
        run: npm run build
        env:
          DATABASE_URL: ''
      - name: Start server & verify APIs
        run: |
          DATABASE_URL= npx next start -p 3099 &
          sleep 5
          curl -sf http://localhost:3099/inventory -o /dev/null || { echo "Server failed to start"; exit 1; }

          ROUTES=(
            "/api/admin/deals"
            "/api/admin/fi-products"
            "/api/admin/service/appointments"
            "/api/admin/service/repair-orders"
            "/api/admin/service/parts"
            "/api/admin/service/technicians"
            "/api/admin/accounting/sales-log"
            "/api/admin/accounting/summary"
            "/api/admin/accounting/commissions"
            "/api/admin/reviews"
            "/api/admin/customers"
            "/api/admin/comms/templates"
            "/api/admin/comms/sequences"
            "/api/admin/comms/log"
            "/api/admin/lenders"
            "/api/admin/credit/history"
            "/api/admin/documents"
            "/api/admin/compliance/checks"
            "/api/admin/floor-plan"
            "/api/admin/pricing"
            "/api/admin/leads"
            "/api/admin/trade-in"
            "/api/admin/analytics/learning"
            "/api/admin/syndication"
            "/api/admin/econtracting"
            "/api/admin/lender-routing"
            "/api/admin/vehicle-history"
            "/api/admin/ofac"
          )
          FAILURES=0
          for route in "${ROUTES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3099${route}")
            if [ "$STATUS" = "500" ]; then
              echo "::error::500 on ${route}"
              FAILURES=$((FAILURES + 1))
            else
              echo "  ${route} -> ${STATUS}"
            fi
          done
          if [ $FAILURES -gt 0 ]; then
            echo "::error::${FAILURES} API routes returned 500 in shadow mode"
            exit 1
          fi
          echo "All ${#ROUTES[@]} routes healthy"

  pipeline-summary:
    runs-on: ubuntu-latest
    name: Pipeline Summary
    needs: [agenticqa-scan, test-suite, shadow-verification]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## AgenticQA Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| AgenticQA Security Scan | ${{ needs.agenticqa-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality & Tests | ${{ needs.test-suite.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Shadow Verification | ${{ needs.shadow-verification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.agenticqa-scan.result }}" = "failure" ] || [ "${{ needs.test-suite.result }}" = "failure" ] || [ "${{ needs.shadow-verification.result }}" = "failure" ]; then
            echo "::error::Pipeline failed - do not deploy"
            exit 1
          fi
          echo "All phases passed - safe to deploy" >> $GITHUB_STEP_SUMMARY
