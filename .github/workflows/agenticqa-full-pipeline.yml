name: AgenticQA Full Pipeline

# Composition of thin callers against reusable workflows in
# the-wolfpack-agency/AgenticQA-core.  Caller-specific jobs (Playwright
# sharding + caching, shadow-mode route sweep, load baseline, SRE auto-fix
# self-commit) stay inline; everything generic delegates upstream.

on:
  # push/pull_request/schedule disabled until May 1 (Actions minutes budget)
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  # schedule:
  #   - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual pipeline trigger'

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────
  # Phase 0: Pipeline Health & Early Prevention
  # ──────────────────────────────────────────────────

  pipeline-rescue:
    name: "Pipeline Health Check"
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/pipeline-health-check.yml@main

  lint:
    needs: [pipeline-rescue]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Code Linting"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: TypeScript type-check
        run: npx tsc --noEmit

  linting-fix:
    needs: [lint]
    if: always() && needs.lint.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "SRE Agent: Auto-Fix"
    # Stays inline: needs caller GITHUB_TOKEN to commit + push back to main.
    # Reusable workflows can't easily propagate that without granting wider
    # secrets:inherit which we don't want.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install AgenticQA SRE tools
        run: pip install -q pyyaml
      - name: Run SRE Auto-Fix Engine
        id: sre
        run: python scripts/sre_autofix.py --path . --max-passes 3
        continue-on-error: true
      - name: Check for changes
        id: verify
        run: |
          if git diff --quiet; then
            echo "status=clean" >> $GITHUB_OUTPUT
          else
            echo "status=fixed" >> $GITHUB_OUTPUT
          fi
      - name: Commit fixes
        if: steps.verify.outputs.status == 'fixed'
        run: |
          git config user.name "sre-agent[bot]"
          git config user.email "sre-agent[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: auto-fix errors via AgenticQA SRE Agent" || true
          git push origin HEAD:${{ github.ref }} || true

  # ──────────────────────────────────────────────────
  # Phase 1: Testing & Compliance (parallel)
  # ──────────────────────────────────────────────────

  phase-1-testing:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: "Phase 1: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: true
      DATABASE_URL: ''
      NEO4J_URL: ''
      REDIS_URL: ''
      NEXTAUTH_URL: 'http://localhost:3000'
      NEXTAUTH_SECRET: 'ci-test-secret-not-real'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Cache Next.js build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build production bundle
        run: npm run build

      - name: Start production server
        run: |
          npm run start &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server ready after $((i * 2))s"
              break
            fi
            sleep 2
          done

      - name: Run Playwright E2E tests (shard ${{ matrix.shard }}/4)
        id: playwright
        run: |
          npx playwright test --project=chromium --workers=4 --shard=${{ matrix.shard }}/4 --reporter=github 2>&1 | tee playwright-output.log || PLAYWRIGHT_FAILED=true
          if [ "$PLAYWRIGHT_FAILED" = "true" ]; then
            mkdir -p test-failures
            grep -i "error\|fail\|expected" playwright-output.log >> test-failures/playwright-errors.txt || true
            echo "PLAYWRIGHT_FAILED=true" >> test-failures/summary.txt
          fi
          echo "status=completed" >> $GITHUB_OUTPUT

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: test-failures-shard-${{ matrix.shard }}
          path: test-failures/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: |
            playwright-output.log
            test-results/
          retention-days: 7

  phase-1-compliance:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 1: Security & Accessibility"
    # Already calls agenticqa-core CLI directly - don't re-wrap.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0  # history-exposure audit walks full git log

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.13'

      - name: Install AgenticQA-core
        run: |
          python -m pip install --upgrade pip
          pip install "agenticqa-core @ git+https://github.com/the-wolfpack-agency/AgenticQA-core.git@main"

      - name: Run AgenticQA app-security audit (codified, zero-token)
        run: |
          agenticqa-audit-app --path .
          agenticqa-audit-history --path .
        continue-on-error: true

  load-baseline:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: "Phase 1: Load Baseline"
    env:
      CI: true
      DATABASE_URL: ''
      NEO4J_URL: ''
      REDIS_URL: ''
      NEXTAUTH_URL: 'http://localhost:3000'
      NEXTAUTH_SECRET: 'ci-test-secret-not-real'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*') }}
          restore-keys: nextjs-${{ runner.os }}-

      - name: Build production bundle
        run: npm run build

      - name: Cache Playwright
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start server
        run: |
          DATABASE_URL= npx next start &
          for i in {1..20}; do
            curl -sf http://localhost:3000/api/health -o /dev/null && break
            sleep 1
          done

      - name: Run load baseline tests
        run: npx playwright test tests/e2e/load-baseline.spec.ts --project=chromium --reporter=github

      - name: Run load test runner (k6 or fallback)
        run: npx playwright test tests/load/load-test-runner.spec.ts --project=chromium --reporter=github --config=playwright.config.ts
        continue-on-error: true

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: load-baseline-results
          path: test-results/
          retention-days: 7

  shadow-verification:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 1: Shadow Mode Verification"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build (shadow mode)
        run: npm run build
        env:
          DATABASE_URL: ''
          NEXTAUTH_SECRET: 'ci-test-secret-not-real-64-chars-aaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          NEXTAUTH_URL: 'http://localhost:3099'
      - name: Start server & verify all API routes
        env:
          NEXTAUTH_SECRET: 'ci-test-secret-not-real-64-chars-aaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          NEXTAUTH_URL: 'http://localhost:3099'
        run: |
          DATABASE_URL= npx next start -p 3099 &
          for i in {1..15}; do
            curl -sf http://localhost:3099/inventory -o /dev/null && break
            sleep 1
          done

          ROUTES=(
            "/api/admin/deals"
            "/api/admin/fi-products"
            "/api/admin/service/appointments"
            "/api/admin/service/repair-orders"
            "/api/admin/service/parts"
            "/api/admin/service/technicians"
            "/api/admin/accounting/sales-log"
            "/api/admin/accounting/summary"
            "/api/admin/accounting/commissions"
            "/api/admin/reviews"
            "/api/admin/customers"
            "/api/admin/comms/templates"
            "/api/admin/comms/sequences"
            "/api/admin/comms/log"
            "/api/admin/lenders"
            "/api/admin/credit/history"
            "/api/admin/documents"
            "/api/admin/compliance/checks"
            "/api/admin/floor-plan"
            "/api/admin/pricing"
            "/api/admin/leads"
            "/api/admin/trade-in"
            "/api/admin/analytics/learning"
            "/api/admin/syndication"
            "/api/admin/econtracting"
            "/api/admin/lender-routing"
            "/api/admin/vehicle-history"
            "/api/admin/ofac"
            "/api/admin/alerts"
            "/api/admin/analytics/intelligence"
          )
          FAILURES=0
          for route in "${ROUTES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3099${route}")
            if [ "$STATUS" = "500" ]; then
              echo "::error::500 on ${route}"
              FAILURES=$((FAILURES + 1))
            else
              echo "  ${route} -> ${STATUS}"
            fi
          done
          if [ $FAILURES -gt 0 ]; then
            echo "::error::${FAILURES} API routes returned 500"
            exit 1
          fi
          echo "All ${#ROUTES[@]} routes healthy"

  # ──────────────────────────────────────────────────
  # Phase 1b: Agent Analysis (after testing completes)
  # ──────────────────────────────────────────────────

  sdet-agent:
    needs: [phase-1-testing, phase-1-compliance]
    if: always()
    name: "Phase 1: SDET Agent"
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/agent-sdet.yml@main
    with:
      artifact_pattern: 'test-results-shard-*'

  compliance-agent:
    needs: [phase-1-testing, phase-1-compliance]
    if: always()
    name: "Phase 1: Compliance Agent"
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/agent-compliance.yml@main
    with:
      src_path: 'src/'

  # ──────────────────────────────────────────────────
  # Phase 2: Fullstack Agent (fixes from Phase 1)
  # ──────────────────────────────────────────────────

  fullstack-agent:
    needs: [sdet-agent, compliance-agent, shadow-verification]
    if: always()
    name: "Phase 2: Fullstack Agent"
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/agent-fullstack.yml@main
    with:
      artifact_pattern: 'test-failures-shard-*'
      verify_build: true

  # ──────────────────────────────────────────────────
  # Phase 3: SRE Agent (production readiness)
  # ──────────────────────────────────────────────────

  sre-agent:
    needs: [fullstack-agent]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 3: SRE Agent"
    # Stays inline: production-readiness checks here are Next.js/npm-specific
    # (.next bundle size, npm audit, src/ console.log hygiene, process.env
    # cataloging).  Generic version would lose those signals.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
      - run: npm ci
      - name: Production readiness checks
        run: |
          echo "## SRE Agent — Production Readiness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Bundle Analysis" >> $GITHUB_STEP_SUMMARY
          if [ -d .next ]; then
            BUNDLE_SIZE=$(du -sh .next/ 2>/dev/null | cut -f1)
            echo "- Build output size: ${BUNDLE_SIZE}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dependency Security" >> $GITHUB_STEP_SUMMARY
          AUDIT_OUTPUT=$(npm audit --production 2>&1 || true)
          VULN_COUNT=$(echo "$AUDIT_OUTPUT" | grep -c "vulnerability" || echo "0")
          echo "- npm audit: ${VULN_COUNT} vulnerability references" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Hygiene" >> $GITHUB_STEP_SUMMARY
          CONSOLE_LOGS=$(grep -rn "console\.log" src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "// debug\|// TODO\|test\|spec" | wc -l || echo "0")
          echo "- console.log in src/: ${CONSOLE_LOGS}" >> $GITHUB_STEP_SUMMARY

          ENV_VARS=$(grep -roh 'process\.env\.\w*' src/ 2>/dev/null | sort -u | wc -l || echo "0")
          echo "- Environment variables used: ${ENV_VARS}" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────
  # Final: Health Verification & Summary
  # ──────────────────────────────────────────────────

  pipeline-health:
    needs: [sre-agent]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Pipeline Health Verification"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - name: Infinite loop check
        run: |
          REPAIR_COUNT=$(git log --oneline -10 | grep -c "auto-fix\|workflow repair" || true)
          if [ "$REPAIR_COUNT" -gt 3 ]; then
            echo "::error::Repair loop detected"
            exit 1
          fi
          echo "Pipeline healthy"

  pipeline-summary:
    needs:
      - pipeline-rescue
      - linting-fix
      - lint
      - phase-1-testing
      - phase-1-compliance
      - shadow-verification
      - load-baseline
      - sdet-agent
      - compliance-agent
      - fullstack-agent
      - sre-agent
      - pipeline-health
    if: always()
    name: "Pipeline Summary"
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/pipeline-summary.yml@main
    with:
      pipeline_rescue_result: ${{ needs.pipeline-rescue.result }}
      lint_result: ${{ needs.lint.result }}
      linting_fix_result: ${{ needs.linting-fix.result }}
      phase_1_testing_result: ${{ needs.phase-1-testing.result }}
      phase_1_compliance_result: ${{ needs.phase-1-compliance.result }}
      shadow_verification_result: ${{ needs.shadow-verification.result }}
      load_baseline_result: ${{ needs.load-baseline.result }}
      sdet_agent_result: ${{ needs.sdet-agent.result }}
      compliance_agent_result: ${{ needs.compliance-agent.result }}
      fullstack_agent_result: ${{ needs.fullstack-agent.result }}
      sre_agent_result: ${{ needs.sre-agent.result }}
      pipeline_health_result: ${{ needs.pipeline-health.result }}
      gating_jobs: 'lint,phase_1_testing,phase_1_compliance,shadow_verification'
