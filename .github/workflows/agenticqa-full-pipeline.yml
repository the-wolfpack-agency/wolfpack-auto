name: AgenticQA Full Pipeline

on:
  # push/pull_request/schedule disabled until May 1 (Actions minutes budget)
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]
  # schedule:
  #   - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual pipeline trigger'

permissions:
  contents: write
  pull-requests: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────
  # Phase 0: Pipeline Health & Early Prevention
  # ──────────────────────────────────────────────────

  pipeline-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Pipeline Health Check"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate workflow YAML
        run: |
          pip install pyyaml -q
          VALID=true
          for file in .github/workflows/*.yml; do
            if [ -f "$file" ]; then
              if python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$file" 2>&1; then
                echo "  $file valid"
              else
                echo "  $file INVALID"
                VALID=false
              fi
            fi
          done
          [ "$VALID" = true ] || exit 1
      - name: Check for repair loops
        run: |
          REPAIR_COUNT=$(git log --oneline -10 | grep -c "auto-fix\|workflow repair" || true)
          if [ "$REPAIR_COUNT" -gt 3 ]; then
            echo "::error::Too many consecutive auto-fix commits — possible infinite loop"
            exit 1
          fi
          echo "Pipeline health: OK (${REPAIR_COUNT} recent repairs)"

  lint:
    needs: [pipeline-rescue]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: "Code Linting"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: TypeScript type-check
        run: npx tsc --noEmit

  linting-fix:
    needs: [lint]
    if: always() && needs.lint.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "SRE Agent: Auto-Fix"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install AgenticQA SRE tools
        run: pip install -q pyyaml
      - name: Run SRE Auto-Fix Engine
        id: sre
        run: python scripts/sre_autofix.py --path . --max-passes 3
        continue-on-error: true
      - name: Check for changes
        id: verify
        run: |
          if git diff --quiet; then
            echo "status=clean" >> $GITHUB_OUTPUT
          else
            echo "status=fixed" >> $GITHUB_OUTPUT
          fi
      - name: Commit fixes
        if: steps.verify.outputs.status == 'fixed'
        run: |
          git config user.name "sre-agent[bot]"
          git config user.email "sre-agent[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: auto-fix errors via AgenticQA SRE Agent" || true
          git push origin HEAD:${{ github.ref }} || true

  # ──────────────────────────────────────────────────
  # Phase 1: Testing & Compliance (parallel)
  # ──────────────────────────────────────────────────

  phase-1-testing:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: "Phase 1: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})"
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: true
      DATABASE_URL: ''
      NEO4J_URL: ''
      REDIS_URL: ''
      NEXTAUTH_URL: 'http://localhost:3000'
      NEXTAUTH_SECRET: 'ci-test-secret-not-real'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build production bundle
        run: npm run build

      - name: Start production server
        run: |
          npm run start &
          # Wait for server to be ready (up to 30s)
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server ready after $((i * 2))s"
              break
            fi
            sleep 2
          done

      - name: Run Playwright E2E tests (shard ${{ matrix.shard }}/4)
        id: playwright
        run: |
          npx playwright test --project=chromium --workers=4 --shard=${{ matrix.shard }}/4 --reporter=github 2>&1 | tee playwright-output.log || PLAYWRIGHT_FAILED=true
          if [ "$PLAYWRIGHT_FAILED" = "true" ]; then
            mkdir -p test-failures
            grep -i "error\|fail\|expected" playwright-output.log >> test-failures/playwright-errors.txt || true
            echo "PLAYWRIGHT_FAILED=true" >> test-failures/summary.txt
          fi
          echo "status=completed" >> $GITHUB_OUTPUT

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures-shard-${{ matrix.shard }}
          path: test-failures/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: |
            playwright-output.log
            test-results/
          retention-days: 7

  phase-1-compliance:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 1: Security & Accessibility"
    steps:
      - uses: actions/checkout@v4

      - name: Run AgenticQA Security Scan
        uses: nhomyk/AgenticQA@98f9f330cc499c7de5a9c11560a132e33eebecef  # main as of 2026-05-03
        with:
          path: '.'
          fail-on-critical: 'false'
          sarif: 'true'
          pr-comment: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: agenticqa.sarif
        continue-on-error: true

  load-baseline:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: "Phase 1: Load Baseline"
    env:
      CI: true
      DATABASE_URL: ''
      NEO4J_URL: ''
      REDIS_URL: ''
      NEXTAUTH_URL: 'http://localhost:3000'
      NEXTAUTH_SECRET: 'ci-test-secret-not-real'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*') }}
          restore-keys: nextjs-${{ runner.os }}-

      - name: Build production bundle
        run: npm run build

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start server
        run: |
          DATABASE_URL= npx next start &
          for i in {1..20}; do
            curl -sf http://localhost:3000/api/health -o /dev/null && break
            sleep 1
          done

      - name: Run load baseline tests
        run: npx playwright test tests/e2e/load-baseline.spec.ts --project=chromium --reporter=github

      - name: Run load test runner (k6 or fallback)
        run: npx playwright test tests/load/load-test-runner.spec.ts --project=chromium --reporter=github --config=playwright.config.ts
        continue-on-error: true

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-baseline-results
          path: test-results/
          retention-days: 7

  shadow-verification:
    needs: [linting-fix]
    if: always() && needs.linting-fix.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 1: Shadow Mode Verification"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build (shadow mode)
        run: npm run build
        env:
          DATABASE_URL: ''
      - name: Start server & verify all API routes
        run: |
          DATABASE_URL= npx next start -p 3099 &
          for i in {1..15}; do
            curl -sf http://localhost:3099/inventory -o /dev/null && break
            sleep 1
          done

          ROUTES=(
            "/api/admin/deals"
            "/api/admin/fi-products"
            "/api/admin/service/appointments"
            "/api/admin/service/repair-orders"
            "/api/admin/service/parts"
            "/api/admin/service/technicians"
            "/api/admin/accounting/sales-log"
            "/api/admin/accounting/summary"
            "/api/admin/accounting/commissions"
            "/api/admin/reviews"
            "/api/admin/customers"
            "/api/admin/comms/templates"
            "/api/admin/comms/sequences"
            "/api/admin/comms/log"
            "/api/admin/lenders"
            "/api/admin/credit/history"
            "/api/admin/documents"
            "/api/admin/compliance/checks"
            "/api/admin/floor-plan"
            "/api/admin/pricing"
            "/api/admin/leads"
            "/api/admin/trade-in"
            "/api/admin/analytics/learning"
            "/api/admin/syndication"
            "/api/admin/econtracting"
            "/api/admin/lender-routing"
            "/api/admin/vehicle-history"
            "/api/admin/ofac"
            "/api/admin/alerts"
            "/api/admin/analytics/intelligence"
          )
          FAILURES=0
          for route in "${ROUTES[@]}"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3099${route}")
            if [ "$STATUS" = "500" ]; then
              echo "::error::500 on ${route}"
              FAILURES=$((FAILURES + 1))
            else
              echo "  ${route} -> ${STATUS}"
            fi
          done
          if [ $FAILURES -gt 0 ]; then
            echo "::error::${FAILURES} API routes returned 500"
            exit 1
          fi
          echo "All ${#ROUTES[@]} routes healthy"

  # ──────────────────────────────────────────────────
  # Phase 1b: Agent Analysis (after testing completes)
  # ──────────────────────────────────────────────────

  sdet-agent:
    needs: [phase-1-testing, phase-1-compliance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 1: SDET Agent"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: ./test-results-data
        continue-on-error: true
      - name: SDET Analysis
        run: |
          echo "## SDET Agent Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f test-results-data/playwright-output.log ]; then
            TOTAL=$(grep -c "✓\|✗\|passed\|failed" test-results-data/playwright-output.log 2>/dev/null || echo "0")
            PASSED=$(grep -c "passed" test-results-data/playwright-output.log 2>/dev/null || echo "0")
            FAILED=$(grep -c "failed" test-results-data/playwright-output.log 2>/dev/null || echo "0")
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Test lines | ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed refs | ${PASSED} |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed refs | ${FAILED} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "No test results artifact available" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Coverage gap analysis
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Gaps" >> $GITHUB_STEP_SUMMARY

          TESTED_ROUTES=$(grep -r "page.goto\|request.get\|request.post" tests/ --include="*.spec.ts" -h | grep -oP '"/[^"]*"' | sort -u | wc -l || echo "0")
          TOTAL_API_ROUTES=$(find src/app/api -name "route.ts" | wc -l || echo "0")
          TOTAL_PAGES=$(find src/app -name "page.tsx" -not -path "*/api/*" | wc -l || echo "0")

          echo "| Asset | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| API routes | ${TOTAL_API_ROUTES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pages | ${TOTAL_PAGES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tested route refs | ${TESTED_ROUTES} |" >> $GITHUB_STEP_SUMMARY

  compliance-agent:
    needs: [phase-1-testing, phase-1-compliance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 1: Compliance Agent"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Compliance analysis
        run: |
          echo "## Compliance Agent Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Security headers check
          echo "### Security Patterns" >> $GITHUB_STEP_SUMMARY
          HEADERS_FILE=$(find src -name "middleware.ts" -o -name "next.config.*" | head -1)
          if [ -n "$HEADERS_FILE" ]; then
            for header in "X-Frame-Options" "X-Content-Type-Options" "Strict-Transport-Security" "Content-Security-Policy"; do
              if grep -rq "$header" src/ next.config.* 2>/dev/null; then
                echo "- $header: configured" >> $GITHUB_STEP_SUMMARY
              else
                echo "- $header: **missing**" >> $GITHUB_STEP_SUMMARY
              fi
            done
          fi

          # PII protection check
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PII Protection" >> $GITHUB_STEP_SUMMARY
          SSN_REFS=$(grep -rn "ssn\|social.*security\|SSN" src/ --include="*.ts" --include="*.tsx" -l 2>/dev/null | wc -l || echo "0")
          ENCRYPT_REFS=$(grep -rn "encrypt\|AES\|cipher" src/ --include="*.ts" --include="*.tsx" -l 2>/dev/null | wc -l || echo "0")
          echo "- Files referencing SSN/PII: ${SSN_REFS}" >> $GITHUB_STEP_SUMMARY
          echo "- Files with encryption: ${ENCRYPT_REFS}" >> $GITHUB_STEP_SUMMARY

          # Env var leak check
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Secret Exposure" >> $GITHUB_STEP_SUMMARY
          NEXT_PUBLIC_SECRETS=$(grep -rn "NEXT_PUBLIC.*SECRET\|NEXT_PUBLIC.*KEY\|NEXT_PUBLIC.*PASSWORD" src/ .env* 2>/dev/null | wc -l || echo "0")
          echo "- NEXT_PUBLIC_ secret leaks: ${NEXT_PUBLIC_SECRETS}" >> $GITHUB_STEP_SUMMARY
          if [ "$NEXT_PUBLIC_SECRETS" -gt 0 ]; then
            echo "::warning::Potential secret exposure via NEXT_PUBLIC_ env vars"
          fi

  # ──────────────────────────────────────────────────
  # Phase 2: Fullstack Agent (fixes from Phase 1)
  # ──────────────────────────────────────────────────

  fullstack-agent:
    needs: [sdet-agent, compliance-agent, shadow-verification]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 2: Fullstack Agent"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Download test failures
        uses: actions/download-artifact@v4
        with:
          name: test-failures
          path: ./test-failures
        continue-on-error: true
      - name: Analyze and fix
        run: |
          echo "## Fullstack Agent" >> $GITHUB_STEP_SUMMARY

          if [ -d test-failures ] && [ "$(ls -A test-failures 2>/dev/null)" ]; then
            echo "### Test Failures Detected" >> $GITHUB_STEP_SUMMARY
            cat test-failures/*.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

            # Build check — ensure production build still works
            echo "### Build Verification" >> $GITHUB_STEP_SUMMARY
            if DATABASE_URL= npm run build 2>&1; then
              echo "- Production build: PASS" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Production build: **FAIL**" >> $GITHUB_STEP_SUMMARY
              echo "::error::Production build failed"
            fi
          else
            echo "No test failures to fix — all clear" >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────
  # Phase 3: SRE Agent (production readiness)
  # ──────────────────────────────────────────────────

  sre-agent:
    needs: [fullstack-agent]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: "Phase 3: SRE Agent"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Production readiness checks
        run: |
          echo "## SRE Agent — Production Readiness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Bundle size check
          echo "### Bundle Analysis" >> $GITHUB_STEP_SUMMARY
          if [ -d .next ]; then
            BUNDLE_SIZE=$(du -sh .next/ 2>/dev/null | cut -f1)
            echo "- Build output size: ${BUNDLE_SIZE}" >> $GITHUB_STEP_SUMMARY
          fi

          # Dependency audit
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Dependency Security" >> $GITHUB_STEP_SUMMARY
          AUDIT_OUTPUT=$(npm audit --production 2>&1 || true)
          VULN_COUNT=$(echo "$AUDIT_OUTPUT" | grep -c "vulnerability" || echo "0")
          echo "- npm audit: ${VULN_COUNT} vulnerability references" >> $GITHUB_STEP_SUMMARY

          # Check for console.log in production code
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Code Hygiene" >> $GITHUB_STEP_SUMMARY
          CONSOLE_LOGS=$(grep -rn "console\.log" src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "// debug\|// TODO\|test\|spec" | wc -l || echo "0")
          echo "- console.log in src/: ${CONSOLE_LOGS}" >> $GITHUB_STEP_SUMMARY

          # Environment variable documentation
          ENV_VARS=$(grep -roh 'process\.env\.\w*' src/ 2>/dev/null | sort -u | wc -l || echo "0")
          echo "- Environment variables used: ${ENV_VARS}" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────
  # Final: Health Verification & Summary
  # ──────────────────────────────────────────────────

  pipeline-health:
    needs: [sre-agent]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Pipeline Health Verification"
    steps:
      - uses: actions/checkout@v4
      - name: Infinite loop check
        run: |
          REPAIR_COUNT=$(git log --oneline -10 | grep -c "auto-fix\|workflow repair" || true)
          if [ "$REPAIR_COUNT" -gt 3 ]; then
            echo "::error::Repair loop detected"
            exit 1
          fi
          echo "Pipeline healthy"

  pipeline-summary:
    needs: [pipeline-rescue, linting-fix, lint, phase-1-testing, phase-1-compliance, shadow-verification, load-baseline, sdet-agent, compliance-agent, fullstack-agent, sre-agent, pipeline-health]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: "Pipeline Summary"
    steps:
      - name: Generate summary
        run: |
          echo "## AgenticQA Full Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 0 | Pipeline Health Check | ${{ needs.pipeline-rescue.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 0 | SRE Linting Auto-Fix | ${{ needs.linting-fix.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 0 | Code Linting | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Consolidated Testing | ${{ needs.phase-1-testing.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Security & Accessibility | ${{ needs.phase-1-compliance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Shadow Mode Verification | ${{ needs.shadow-verification.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Load Baseline | ${{ needs.load-baseline.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | SDET Agent | ${{ needs.sdet-agent.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 1 | Compliance Agent | ${{ needs.compliance-agent.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 2 | Fullstack Agent | ${{ needs.fullstack-agent.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 3 | SRE Agent | ${{ needs.sre-agent.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Final | Health Verification | ${{ needs.pipeline-health.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Determine overall result
          FAILED=false
          for result in "${{ needs.lint.result }}" "${{ needs.phase-1-testing.result }}" "${{ needs.phase-1-compliance.result }}" "${{ needs.shadow-verification.result }}"; do
            if [ "$result" = "failure" ]; then
              FAILED=true
            fi
          done

          if [ "$FAILED" = "true" ]; then
            echo "::error::Pipeline failed — do not deploy"
            echo "**RESULT: FAILED — do not deploy**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "**RESULT: ALL PHASES PASSED — safe to deploy**" >> $GITHUB_STEP_SUMMARY
