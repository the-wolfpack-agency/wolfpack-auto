name: Red Team Governance Scan

on:
  schedule:
    - cron: '30 3 * * 0'
  push:
    branches: [main]
    paths:
      - 'src/lib/auth-guard.ts'
      - 'src/lib/auth.ts'
      - 'src/middleware.ts'
      - 'src/lib/rate-limit.ts'
      - 'src/lib/tenant-context.ts'
      - 'src/lib/tenant-resolver.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-team:
    uses: the-wolfpack-agency/AgenticQA-core/.github/workflows/red-team-governance.yml@b468565eaff7ad4dd1b1872015282dd597dae022  # main
    with:
      repo: ${{ github.repository }}
      branch: ${{ github.ref_name }}
      apply: 'false'
    secrets: inherit
