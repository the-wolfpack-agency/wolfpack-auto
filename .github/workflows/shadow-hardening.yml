name: Shadow Hardening Gate

on:
  # pull_request disabled until May 1 (Actions minutes budget)
  # pull_request:
  #   paths: ["wolfpack-auto/**"]
  workflow_dispatch:

env:
  SHADOW_PORT: 3099

permissions:
  contents: read

jobs:
  shadow-hardening:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wolfpack-auto

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Setup Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies for vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run shadow hardening tests
        id: shadow-tests
        run: bash scripts/shadow-test.sh
        continue-on-error: true

      - name: Generate HTML report
        if: always()
        run: node scripts/generate-shadow-report.mjs

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: shadow-hardening-report
          path: |
            wolfpack-auto/shadow-hardening-report.html
            wolfpack-auto/shadow-hardening-results.json
            wolfpack-auto/test-results/
          retention-days: 30

      - name: Comment PR with summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const resultsPath = path.join(
              process.env.GITHUB_WORKSPACE,
              'wolfpack-auto',
              'shadow-hardening-results.json'
            );

            let body;
            if (!fs.existsSync(resultsPath)) {
              body = [
                '## Shadow Hardening Gate',
                '',
                '> No results found — the test run may have crashed before producing output.',
                '',
                `**Status:** :warning: Inconclusive`,
              ].join('\n');
            } else {
              const data = JSON.parse(fs.readFileSync(resultsPath, 'utf-8'));
              const stats = data.stats || {};
              const passed = stats.expected || 0;
              const failed = stats.unexpected || 0;
              const skipped = stats.skipped || 0;
              const flaky = stats.flaky || 0;
              const total = passed + failed + skipped + flaky;
              const duration = stats.duration
                ? `${(stats.duration / 1000).toFixed(1)}s`
                : 'N/A';
              const icon = failed === 0 ? ':white_check_mark:' : ':x:';
              const verdict = failed === 0 ? 'All tests passed' : `${failed} test(s) failed`;

              body = [
                '## Shadow Hardening Gate',
                '',
                `**Status:** ${icon} ${verdict}`,
                '',
                '| Metric | Value |',
                '|--------|-------|',
                `| Total  | ${total} |`,
                `| Passed | ${passed} |`,
                `| Failed | ${failed} |`,
                `| Skipped | ${skipped} |`,
                `| Duration | ${duration} |`,
                '',
                '> Full HTML report available in the workflow artifacts.',
              ].join('\n');
            }

            // Find and update existing comment or create new one
            const marker = '## Shadow Hardening Gate';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if tests failed
        if: steps.shadow-tests.outcome == 'failure'
        run: |
          echo "::error::Shadow hardening tests failed — see report for details."
          exit 1
